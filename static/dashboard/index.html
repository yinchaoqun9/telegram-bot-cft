<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pet Pantry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1915;
      --muted: #6b645a;
      --line: #d4ccc0;
      --card: #faf7f1;
      --accent: #0f6b5c;
      --accent-ink: #f4fffb;
      --warn: #9a4a1a;
      --danger: #8b2e2e;
      --shadow: 0 12px 40px rgba(28, 25, 21, 0.08);
      --radius: 14px;
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #fff8ea 0%, transparent 55%),
        radial-gradient(700px 380px at 100% 0%, #dceee8 0%, transparent 50%),
        var(--bg);
    }
    .wrap {
      width: min(960px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.25rem 0 4rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }
    .header-right {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: flex-end;
    }
    .lang-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: #fff;
    }
    .lang-toggle button {
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 0.35rem 0.7rem;
      font-size: 0.85rem;
    }
    .lang-toggle button.active {
      background: var(--ink);
      color: #faf7f1;
    }
    .brand h1 {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      max-width: 36rem;
      line-height: 1.45;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem 1.35rem;
    }
    .stack { display: grid; gap: 1rem; }
    .gate {
      display: grid;
      gap: 1rem;
      place-items: start;
      padding: 2rem 1.5rem;
    }
    .gate h2, .block-title {
      font-family: var(--display);
      font-size: 1.35rem;
      margin: 0;
      font-weight: 600;
    }
    .block-sub {
      margin: 0.25rem 0 0.85rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .muted { color: var(--muted); }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .user {
      display: flex;
      gap: 0.65rem;
      align-items: center;
    }
    .user img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
    }
    button, .btn {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    button.small { padding: 0.28rem 0.65rem; font-size: 0.85rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost { background: transparent; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 0.35rem 0.75rem;
      font-size: 0.9rem;
    }
    .chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #faf7f1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    tr.soon td { background: rgba(154, 74, 26, 0.06); }
    tr.overdue td { background: rgba(139, 46, 46, 0.08); }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.warn { color: var(--warn); border-color: rgba(154,74,26,.35); }
    .badge.danger { color: var(--danger); border-color: rgba(139,46,46,.35); }
    .empty {
      padding: 1.25rem 0.5rem;
      color: var(--muted);
      text-align: center;
    }
    .err {
      color: var(--danger);
      margin: 0.5rem 0 0;
      white-space: pre-wrap;
    }
    .radar-grid {
      display: grid;
      gap: 0.85rem;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    @media (min-width: 900px) {
      .radar-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      .radar-grid { grid-template-columns: 1fr; }
    }
    .radar-col {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem 0.8rem;
      background: #fffdf8;
      min-height: 8rem;
    }
    .radar-col h3 {
      margin: 0 0 0.55rem;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .radar-col.overdue h3 { color: var(--danger); }
    .radar-col.soon h3 { color: var(--warn); }
    .radar-item {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-top: 1px dashed var(--line);
    }
    .radar-item:first-of-type { border-top: none; }
    .radar-item strong { display: block; font-size: 0.95rem; }
    .restock-list { list-style: none; margin: 0; padding: 0; }
    .restock-list li {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--line);
    }
    .restock-list li:last-child { border-bottom: none; }
    .restock-list label { flex: 1; cursor: pointer; line-height: 1.35; }
    .restock-meta { font-size: 0.85rem; color: var(--muted); }
    .hint-line {
      margin: 0.75rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .kitchen-summary {
      font-family: var(--display);
      font-size: 1.15rem;
      margin: 0 0 0.85rem;
      line-height: 1.35;
    }
    .kpi-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-bottom: 0.85rem;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .kpi-row b { color: var(--ink); font-weight: 600; }
    .mix-bar {
      display: flex;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--line);
      margin-bottom: 0.55rem;
    }
    .mix-bar span { display: block; height: 100%; }
    .mix-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }
    @media (max-width: 720px) {
      th, td { padding: 0.65rem 0.3rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Pet Pantry</h1>
        <p id="brandSub"></p>
      </div>
      <div class="header-right">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" id="langZh" data-lang="zh">中文</button>
          <button type="button" id="langEn" data-lang="en">EN</button>
        </div>
        <div id="userBar" hidden></div>
      </div>
    </header>

    <section id="loginPanel" class="panel gate">
      <h2 id="loginTitle"></h2>
      <p class="muted" id="loginBody"></p>
      <div id="telegramWidget"></div>
      <p id="loginHint" class="err" hidden></p>
    </section>

    <div id="appPanel" class="stack" hidden>
      <section class="panel" id="householdPanel">
        <p class="section-label" id="hhLabel">Household</p>
        <p class="block-sub" id="hhSub"></p>
        <div id="hhBody"></div>
      </section>

      <section class="panel" id="kitchenPanel">
        <p class="section-label" id="kitchenLabel"></p>
        <p class="kitchen-summary" id="kitchenSummary"></p>
        <div class="kpi-row" id="kitchenKpis"></div>
        <div class="mix-bar" id="mixBar" aria-hidden="true"></div>
        <div class="mix-legend" id="mixLegend"></div>
      </section>

      <section class="panel" id="radarPanel">
        <h2 class="block-title" id="radarTitle"></h2>
        <p class="block-sub" id="radarSub"></p>
        <div class="radar-grid" id="radarGrid"></div>
      </section>

      <section class="panel" id="restockPanel">
        <div class="row" style="margin-bottom:0.35rem">
          <div>
            <h2 class="block-title" id="restockTitle"></h2>
            <p class="block-sub" style="margin-bottom:0" id="restockSub"></p>
          </div>
          <button type="button" class="primary" id="copyRestockBtn"></button>
        </div>
        <ul class="restock-list" id="restockList"></ul>
        <p class="hint-line" id="restockHint"></p>
      </section>

      <section class="panel">
        <div class="row">
          <div>
            <p class="section-label" id="detailLabel"></p>
            <div class="filters" id="filters"></div>
          </div>
          <button type="button" class="ghost" id="refreshBtn"></button>
        </div>
        <div id="tableWrap"></div>
        <p id="appErr" class="err" hidden></p>
      </section>
    </div>
  </div>

  <script>
    const CAT_KEYS = ["冻干", "罐头", "汤包", "猫条", "零食", "猫砂", "药品", "其他"];
    const MIX_COLORS = {
      "冻干": "#0f6b5c",
      "罐头": "#9a4a1a",
      "汤包": "#3d6ea5",
      "猫条": "#6b4c9a",
      "零食": "#5a6b3a",
      "猫砂": "#8a7355",
      "药品": "#8b2e2e",
      "其他": "#6b645a",

    const DEFAULT_THRESHOLDS = {
      "罐头": 6, "冻干": 3, "汤包": 2, "猫条": 2, "零食": 2,
      "猫砂": 1, "药品": 1, "其他": 2,

    const I18N = {

        loginTitle: "用 Telegram 登录",

        soonN: (n) => `${n} 样一周内到期`,

          "零食": "零食",
          "猫砂": "猫砂",
          "药品": "药品",
          "其他": "其他",
        },
        botMissing:
          "服务器未配置 TELEGRAM_BOT_USERNAME。请在 .env 设置 bot 用户名，并在 BotFather 用 /setdomain 绑定此站点域名。",
        signedIn: "已登录",
        hhLabel: "家庭柜",

      },
      en: {
        brandSub: "Pet pantry: what to open/toss this week and what to buy next. Voice-log cat/dog food, litter, and meds in Telegram.",

        kpiTotal: "Units",

        lowTag: "low",
        radarTitle: "Expiry / opened radar",
        radarSub: "Handle these first. Open −1 stamps opened time and reduces qty.",

        colSoon: "≤7 days · use this week",
        colLater: "8–15 days",
        colOpened: "Opened",
        emptyOverdue: "Nothing overdue — nice.",
        emptySoon: "Nothing due within a week.",
        emptyLater: "Nothing urgent in the next two weeks.",
        emptyOpened: "No opened lots being tracked.",
        daysOverdue: (n) => `${n}d overdue`,
        daysLeft: (n) => `${n}d left`,
        openDaysLeft: (n) => (n < 0 ? `${Math.abs(n)}d past open window` : `${n}d left after open`),
        openBtn: "Open −1",
        restockTitle: "Restock list",
        restockSub: "Estimated from category thresholds. Copy into Notes or a shopping list — the bot does not place orders.",
        copyList: "Copy list",
        restockOk: "Stock looks fine across categories — nothing to buy for now.",
        suggestBuy: (n) => `Buy ~${n}`,
        critical: "About to run out",
        stockBelow: (have, th) => `Have ${have}, below target ${th}`,
        afterSoon: (soonQty, after, th) => `~${soonQty} due soon; ~${after} left after (target ≥${th})`,
        priority: (cat, n) => `Priority: ${cat} (buy ~${n})`,
        copied: "Copied to clipboard.",
        nothingChecked: "No checked items to copy.",
        copyTitle: "Pet pantry restock list:",
        detailLabel: "Detail check",
        refresh: "Refresh",
        emptyTable: "No inventory yet. Open the Telegram bot and send a voice note.",
        thBrand: "Brand / name",
        thCat: "Category",
        thBestBy: "Best by",
        thQty: "Qty",
        usedBtn: "Used −1",
        filterAll: "All",
        cats: {
          "冻干": "Freeze-dried",
          "罐头": "Cans / wet",
          "汤包": "Soup pouches",
          "猫条": "Cat sticks",
          "零食": "Treats",
          "猫砂": "Litter",
          "药品": "Meds",
          "其他": "Other",
        },
        botMissing:
          "TELEGRAM_BOT_USERNAME is not set. Add the bot username in .env and bind this host with BotFather /setdomain.",
        signedIn: "Signed in",
        hhLabel: "Household",
        hhSolo: "You're on a solo pantry. Create a share code (free for 2). Expiry digests go to every member. Voice/Open alerts stay off until you enable them.",
        hhShared: (code, n, max) => `Shared · code ${code} · ${n}/${max} members. Expiry digests go to everyone.`,
        hhCreate: "Create shared pantry",
        hhJoin: "Join",
        hhLeave: "Leave",
        hhCodePh: "PET-XXXX",
        hhNotifyOn: "Enable partner change alerts",
        hhNotifyOff: "Disable partner change alerts",
        hhNotifyHint: "Change alerts: voice / Open / Used (optional). Digests always send.",
      },
    };

    let state = {
      user: null,
      items: [],
      filter: "全部",
      botUsername: "",
      thresholds: { ...DEFAULT_THRESHOLDS },
      openShelf: { ...DEFAULT_OPEN_SHELF },
      restockChecked: {},
      household: null,
      lang: localStorage.getItem("dashboard_lang") === "en" ? "en" : "zh",
      serverLoginHint: "",
    };

    function $(id) { return document.getElementById(id); }
    function t() { return I18N[state.lang]; }
    function catLabel(key) { return t().cats[key] || key; }

    function daysUntil(bestBy) {
      if (!bestBy) return null;
      const d = new Date(String(bestBy).slice(0, 10) + "T12:00:00");
      if (Number.isNaN(d.getTime())) return null;
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      return Math.round((d - today) / 86400000);
    }

    function urgencyRank(item) {
      const d = daysUntil(item.best_by);
      if (d == null) return 3;
      if (d < 0) return 0;
      if (d <= 7) return 1;
      if (d <= 15) return 2;
      return 3;
    }

    function sortByUrgency(items) {
      return [...items].sort((a, b) => {
        const ra = urgencyRank(a);
        const rb = urgencyRank(b);
        if (ra !== rb) return ra - rb;
        const da = daysUntil(a.best_by);
        const db = daysUntil(b.best_by);
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      });
    }

    function catKey(item) {
      const c = (item.category || "").trim();
      if (CAT_KEYS.slice(0, -1).includes(c)) return c;
      return "其他";
    }

    function qtyOf(item) {
      const n = Number(item.quantity);
      return Number.isFinite(n) ? n : 0;
    }

    function itemTitle(item) {
      const cat = catKey(item);
      const brand = (item.brand || "").trim();
      const flavor = (item.flavor || "").trim();
      if (cat === "药品") {
        return flavor || brand || "—";
      }
      return brand || flavor || "—";
    }

    function itemSubtitle(item) {
      const cat = catKey(item);
      const brand = (item.brand || "").trim();
      const flavor = (item.flavor || "").trim();
      if (cat === "药品") {
        return [brand, catLabel(cat)].filter(Boolean).join(" · ");
      }
      return [catLabel(cat), flavor && flavor !== itemTitle(item) ? flavor : ""]
        .filter(Boolean)
        .join(" · ");
    }

    function openShelfFor(item) {
      const cat = catKey(item);
      return Number(state.openShelf[cat] ?? DEFAULT_OPEN_SHELF[cat] ?? 7);
    }

    function daysAfterOpenLeft(item) {
      if (!item.opened_at) return null;
      const opened = new Date(item.opened_at);
      if (Number.isNaN(opened.getTime())) return null;
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      opened.setHours(12, 0, 0, 0);
      const elapsed = Math.round((today - opened) / 86400000);
      return openShelfFor(item) - elapsed;
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
      if (!res.ok) {
        const detail = (data && (data.detail || data.message)) || res.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    function filteredItems() {
      let items = state.items;
      if (state.filter === "其他") {
        items = items.filter((it) => !CAT_KEYS.slice(0, -1).includes(it.category));
      } else if (state.filter !== "全部") {
        items = items.filter((it) => it.category === state.filter);
      }
      return sortByUrgency(items);
    }

    function bucketItems() {
      const overdue = [];
      const soon = [];
      const later = [];
      const opened = [];
      for (const it of state.items) {
        const d = daysUntil(it.best_by);
        if (d != null) {
          if (d < 0) overdue.push({ ...it, _days: d });
          else if (d <= 7) soon.push({ ...it, _days: d });
          else if (d <= 15) later.push({ ...it, _days: d });
        }
        const od = daysAfterOpenLeft(it);
        if (od != null && od <= 3) {
          opened.push({ ...it, _openLeft: od });
        }
      }
      const byDays = (a, b) => a._days - b._days;
      overdue.sort(byDays);
      soon.sort(byDays);
      later.sort(byDays);
      opened.sort((a, b) => a._openLeft - b._openLeft);
      return { overdue, soon, later, opened };
    }

    function renderRadarItem(it, opts = {}) {
      const i = t();
      const useOpenClock = !!opts.openClock;
      const dayLabel = useOpenClock
        ? i.openDaysLeft(it._openLeft)
        : (it._days < 0 ? i.daysOverdue(Math.abs(it._days)) : i.daysLeft(it._days));
      return `<div class="radar-item">
        <div>
          <strong>${escapeHtml(itemTitle(it))}</strong>
          <div class="muted" style="font-size:0.85rem">
            ${escapeHtml(itemSubtitle(it))}
            · ×${escapeHtml(qtyOf(it))} · ${escapeHtml(dayLabel)}
          </div>
        </div>
        <button type="button" class="small" data-open="${escapeHtml(it.id)}">${escapeHtml(i.openBtn)}</button>
      </div>`;
    }

    function renderRadarCol(title, cls, items, emptyMsg, openClock) {
      const body = items.length
        ? items.map((it) => renderRadarItem(it, { openClock })).join("")
        : `<div class="empty" style="padding:0.6rem 0">${escapeHtml(emptyMsg)}</div>`;
      return `<div class="radar-col ${cls}"><h3>${escapeHtml(title)} · ${items.length}</h3>${body}</div>`;
    }

    function renderRadar() {
      const i = t();
      const { overdue, soon, later, opened } = bucketItems();
      $("radarGrid").innerHTML =
        renderRadarCol(i.colOverdue, "overdue", overdue, i.emptyOverdue, false) +
        renderRadarCol(i.colSoon, "soon", soon, i.emptySoon, false) +
        renderRadarCol(i.colLater, "", later, i.emptyLater, false) +
        renderRadarCol(i.colOpened, "soon", opened, i.emptyOpened, true);
      $("radarGrid").querySelectorAll("[data-open]").forEach((btn) => {
        btn.onclick = () => markOpen(btn.dataset.open, btn);
      });
    }

    function categoryTotals() {
      const totals = {};
      for (const key of Object.keys(state.thresholds)) totals[key] = 0;
      for (const it of state.items) {
        const k = catKey(it);
        totals[k] = (totals[k] || 0) + qtyOf(it);
      }
      return totals;
    }

    function soonQtyByCategory() {
      const soon = {};
      for (const it of state.items) {
        const d = daysUntil(it.best_by);
        if (d == null || d < 0 || d > 7) continue;
        const k = catKey(it);
        soon[k] = (soon[k] || 0) + qtyOf(it);
      }
      return soon;
    }

    function buildRestockSuggestions() {
      const i = t();
      const totals = categoryTotals();
      const soon = soonQtyByCategory();
      const suggestions = [];
      for (const [cat, threshold] of Object.entries(state.thresholds)) {
        const have = totals[cat] || 0;
        const soonQty = soon[cat] || 0;
        const afterSoon = Math.max(0, have - soonQty);
        let reason = "";
        let suggestBuy = 0;
        if (have < threshold) {
          suggestBuy = threshold - have;
          reason = i.stockBelow(have, threshold);
        } else if (afterSoon < threshold && soonQty > 0) {
          suggestBuy = threshold - afterSoon;
          reason = i.afterSoon(soonQty, afterSoon, threshold);
        }
        if (suggestBuy > 0) {
          suggestions.push({
            id: cat,
            cat,
            suggestBuy,
            reason,
            critical: afterSoon === 0 && soonQty > 0,
          });
        }
      }
      suggestions.sort((a, b) => Number(b.critical) - Number(a.critical) || b.suggestBuy - a.suggestBuy);
      return suggestions;
    }

    function renderRestock() {
      const i = t();
      const suggestions = buildRestockSuggestions();
      const list = $("restockList");
      if (!suggestions.length) {
        list.innerHTML = `<li><label class="muted">${escapeHtml(i.restockOk)}</label></li>`;
        $("restockHint").textContent = "";
        return;
      }
      list.innerHTML = suggestions.map((s) => {
        const checked = state.restockChecked[s.id] !== false;
        return `<li>
          <input type="checkbox" data-restock="${escapeHtml(s.id)}" ${checked ? "checked" : ""} />
          <label>
            <strong>${escapeHtml(catLabel(s.cat))}</strong> · ${escapeHtml(i.suggestBuy(s.suggestBuy))}
            ${s.critical ? ` <span class="badge danger">${escapeHtml(i.critical)}</span>` : ""}
            <div class="restock-meta">${escapeHtml(s.reason)}</div>
          </label>
        </li>`;
      }).join("");
      list.querySelectorAll("[data-restock]").forEach((cb) => {
        cb.onchange = () => {
          state.restockChecked[cb.dataset.restock] = cb.checked;
        };
      });
      const top = suggestions[0];
      $("restockHint").textContent = top
        ? i.priority(catLabel(top.cat), top.suggestBuy)
        : "";
    }

    function copyRestock() {
      const i = t();
      const suggestions = buildRestockSuggestions().filter(
        (s) => state.restockChecked[s.id] !== false
      );
      if (!suggestions.length) {
        $("restockHint").textContent = i.nothingChecked;
        return;
      }
      const lines = [i.copyTitle].concat(
        suggestions.map((s) => `- ${catLabel(s.cat)} ×${s.suggestBuy}（${s.reason}）`)
      );
      const text = lines.join("\n");
      navigator.clipboard.writeText(text).then(
        () => { $("restockHint").textContent = i.copied; },
        () => { $("restockHint").textContent = text; }
      );
    }

    function renderKitchen() {
      const i = t();
      const totals = categoryTotals();
      const totalQty = Object.values(totals).reduce((a, b) => a + b, 0);
      const { overdue, soon, opened } = bucketItems();
      const overdueN = overdue.length;
      const soonN = soon.length;
      const openedN = opened.length;
      const lowCats = Object.entries(state.thresholds)
        .filter(([cat, th]) => (totals[cat] || 0) < th)
        .map(([cat]) => cat);

      let summary = "";
      if (totalQty === 0) {
        summary = i.kitchenEmpty;
      } else {
        const wetOk = (totals["罐头"] || 0) >= (state.thresholds["罐头"] || 6);
        const dryLow = (totals["冻干"] || 0) < (state.thresholds["冻干"] || 3);
        const medLow = (totals["药品"] || 0) < (state.thresholds["药品"] || 1);
        const bits = [];
        bits.push(wetOk ? i.wetOk : i.wetLow);
        bits.push(dryLow ? i.dryLow : i.dryOk);
        bits.push(medLow ? i.medLow : i.medOk);
        if (soonN) bits.push(i.soonN(soonN));
        if (overdueN) bits.push(i.overdueN(overdueN));
        if (openedN) bits.push(i.openedN(openedN));
        summary = bits.join(state.lang === "zh" ? "；" : "; ") + (state.lang === "zh" ? "。" : ".");
      }
      $("kitchenSummary").textContent = summary;
      $("kitchenKpis").innerHTML = `
        <span>${escapeHtml(i.kpiTotal)} <b>${totalQty}</b></span>
        <span>${escapeHtml(i.kpiSoon)} <b>${soonN}</b></span>
        <span>${escapeHtml(i.kpiOverdue)} <b>${overdueN}</b></span>
        <span>${escapeHtml(i.kpiOpened)} <b>${openedN}</b></span>
        <span>${escapeHtml(i.kpiSku)} <b>${state.items.length}</b></span>
      `;

      const bar = $("mixBar");
      const legend = $("mixLegend");
      if (totalQty === 0) {
        bar.innerHTML = "";
        legend.innerHTML = "";
        return;
      }
      bar.innerHTML = Object.entries(totals)
        .filter(([, n]) => n > 0)
        .map(([cat, n]) => {
          const pct = (n / totalQty) * 100;
          const color = MIX_COLORS[cat] || MIX_COLORS["其他"];
          return `<span style="width:${pct}%;background:${color}" title="${escapeHtml(catLabel(cat))} ${n}"></span>`;
        })
        .join("");
      legend.innerHTML = Object.entries(totals)
        .filter(([, n]) => n > 0)
        .map(([cat, n]) => {
          const color = MIX_COLORS[cat] || MIX_COLORS["其他"];
          const low = lowCats.includes(cat) ? ` · ${i.lowTag}` : "";
          return `<span><i class="dot" style="background:${color}"></i>${escapeHtml(catLabel(cat))} ${n}${escapeHtml(low)}</span>`;
        })
        .join("");
    }

    function renderTable() {
      const i = t();
      const items = filteredItems();
      if (!items.length) {
        $("tableWrap").innerHTML = `<div class="empty">${escapeHtml(i.emptyTable)}</div>`;
        return;
      }

      const rows = items.map((it) => {

        } else if (d != null && d <= 7) {
          rowClass = "soon";

        } else if (d != null) {
          badge = `<span class="badge">${escapeHtml(i.daysLeft(d))}</span>`;
        }
        const openLeft = daysAfterOpenLeft(it);
        let openBadge = "";
        if (openLeft != null) {
          openBadge = `<div><span class="badge ${openLeft <= 0 ? "danger" : "warn"}">${escapeHtml(i.openDaysLeft(openLeft))}</span></div>`;
        }
        return `<tr class="${rowClass}">
          <td><strong>${escapeHtml(itemTitle(it))}</strong><div class="muted">${escapeHtml(itemSubtitle(it))}</div></td>
          <td>${escapeHtml(catLabel(catKey(it)))}</td>
          <td>${escapeHtml(it.best_by || "—")}<div>${badge}</div>${openBadge}</td>
          <td>×${escapeHtml(qtyOf(it))}</td>

      $("tableWrap").innerHTML = `

          <tbody>${rows}</tbody>

      });

      $("langZh").onclick = () => setLang("zh");
      $("langEn").onclick = () => setLang("en");
      setLang(state.lang);

      try {
        const cfg = await api("/api/dashboard/config");
        state.botUsername = cfg.bot_username || "";
        if (cfg.restock_thresholds && typeof cfg.restock_thresholds === "object") {
          state.thresholds = { ...DEFAULT_THRESHOLDS, ...cfg.restock_thresholds };
        }
        if (cfg.open_shelf_days && typeof cfg.open_shelf_days === "object") {
          state.openShelf = { ...DEFAULT_OPEN_SHELF, ...cfg.open_shelf_days };
        }
        if (cfg.login_hint) {
          state.serverLoginHint = cfg.login_hint;
          $("loginHint").hidden = false;
          $("loginHint").textContent = cfg.login_hint;
        }
      } catch (e) {
        $("loginHint").hidden = false;
        $("loginHint").textContent = e.message || String(e);
      }
      renderWidget();

      try {
        const me = await api("/api/me");
        state.user = { user_id: me.user_id, first_name: t().signedIn };
        showApp();
        await loadInventory();
        await loadHousehold();
      } catch {
        /* stay on login */
      }

      $("refreshBtn").onclick = async () => {
        await loadInventory();
        await loadHousehold();
      };
      $("copyRestockBtn").onclick = () => copyRestock();
    }

    boot();
  </script>
</body>
</html>
