<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cat Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --ink: #1c1915;
      --muted: #6b645a;
      --line: #d4ccc0;
      --card: #faf7f1;
      --accent: #0f6b5c;
      --accent-ink: #f4fffb;
      --warn: #9a4a1a;
      --danger: #8b2e2e;
      --ok: #2f6b3a;
      --shadow: 0 12px 40px rgba(28, 25, 21, 0.08);
      --radius: 14px;
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 10% -10%, #fff8ea 0%, transparent 55%),
        radial-gradient(700px 380px at 100% 0%, #dceee8 0%, transparent 50%),
        var(--bg);
    }
    .wrap {
      width: min(960px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.25rem 0 4rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }
    .brand h1 {
      font-family: var(--display);
      font-weight: 600;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    .brand p {
      margin: 0;
      color: var(--muted);
      max-width: 36rem;
      line-height: 1.45;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.25rem 1.35rem;
    }
    .stack { display: grid; gap: 1rem; }
    .gate {
      display: grid;
      gap: 1rem;
      place-items: start;
      padding: 2rem 1.5rem;
    }
    .gate h2, .block-title {
      font-family: var(--display);
      font-size: 1.35rem;
      margin: 0;
      font-weight: 600;
    }
    .block-sub {
      margin: 0.25rem 0 0.85rem;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
    }
    .muted { color: var(--muted); }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
    }
    .user {
      display: flex;
      gap: 0.65rem;
      align-items: center;
    }
    .user img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
    }
    button, .btn {
      font: inherit;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    button.small { padding: 0.28rem 0.65rem; font-size: 0.85rem; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.ghost { background: transparent; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .chip {
      border-radius: 999px;
      border: 1px solid var(--line);
      background: transparent;
      padding: 0.35rem 0.75rem;
      font-size: 0.9rem;
    }
    .chip.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #faf7f1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    th, td {
      text-align: left;
      padding: 0.7rem 0.45rem;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 500;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    tr.soon td { background: rgba(154, 74, 26, 0.06); }
    tr.overdue td { background: rgba(139, 46, 46, 0.08); }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .badge.warn { color: var(--warn); border-color: rgba(154,74,26,.35); }
    .badge.danger { color: var(--danger); border-color: rgba(139,46,46,.35); }
    .empty {
      padding: 1.25rem 0.5rem;
      color: var(--muted);
      text-align: center;
    }
    .err {
      color: var(--danger);
      margin: 0.5rem 0 0;
      white-space: pre-wrap;
    }
    .radar-grid {
      display: grid;
      gap: 0.85rem;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    @media (max-width: 820px) {
      .radar-grid { grid-template-columns: 1fr; }
    }
    .radar-col {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.75rem 0.8rem;
      background: #fffdf8;
      min-height: 8rem;
    }
    .radar-col h3 {
      margin: 0 0 0.55rem;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }
    .radar-col.overdue h3 { color: var(--danger); }
    .radar-col.soon h3 { color: var(--warn); }
    .radar-item {
      display: flex;
      gap: 0.5rem;
      align-items: flex-start;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-top: 1px dashed var(--line);
    }
    .radar-item:first-of-type { border-top: none; }
    .radar-item strong { display: block; font-size: 0.95rem; }
    .restock-list { list-style: none; margin: 0; padding: 0; }
    .restock-list li {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      padding: 0.55rem 0;
      border-bottom: 1px solid var(--line);
    }
    .restock-list li:last-child { border-bottom: none; }
    .restock-list label { flex: 1; cursor: pointer; line-height: 1.35; }
    .restock-meta { font-size: 0.85rem; color: var(--muted); }
    .hint-line {
      margin: 0.75rem 0 0;
      font-size: 0.88rem;
      color: var(--muted);
    }
    .kitchen-summary {
      font-family: var(--display);
      font-size: 1.15rem;
      margin: 0 0 0.85rem;
      line-height: 1.35;
    }
    .kpi-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-bottom: 0.85rem;
      font-size: 0.92rem;
      color: var(--muted);
    }
    .kpi-row b { color: var(--ink); font-weight: 600; }
    .mix-bar {
      display: flex;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      background: var(--line);
      margin-bottom: 0.55rem;
    }
    .mix-bar span { display: block; height: 100%; }
    .mix-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .section-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }
    @media (max-width: 720px) {
      th, td { padding: 0.65rem 0.3rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Cat Inventory</h1>
        <p>先看这周该吃什么、该买什么；明细表留给核对。语音仍在 Telegram bot 录入。</p>
      </div>
      <div id="userBar" hidden></div>
    </header>

    <section id="loginPanel" class="panel gate">
      <h2>Sign in with Telegram</h2>
      <p class="muted">只显示你的 Telegram 账号对应的库存行。管理员密钥不会进浏览器。</p>
      <div id="telegramWidget"></div>
      <p id="loginHint" class="err" hidden></p>
    </section>

    <div id="appPanel" class="stack" hidden>
      <section class="panel" id="kitchenPanel">
        <p class="section-label">厨房状态</p>
        <p class="kitchen-summary" id="kitchenSummary">加载中…</p>
        <div class="kpi-row" id="kitchenKpis"></div>
        <div class="mix-bar" id="mixBar" aria-hidden="true"></div>
        <div class="mix-legend" id="mixLegend"></div>
      </section>

      <section class="panel" id="radarPanel">
        <h2 class="block-title">临期雷达</h2>
        <p class="block-sub">这周先吃这些。点 Open −1 表示开了一袋/一罐。</p>
        <div class="radar-grid" id="radarGrid"></div>
      </section>

      <section class="panel" id="restockPanel">
        <div class="row" style="margin-bottom:0.35rem">
          <div>
            <h2 class="block-title">补货清单</h2>
            <p class="block-sub" style="margin-bottom:0">按品类库存阈值估算；勾选后可复制发到备忘录。</p>
          </div>
          <button type="button" class="primary" id="copyRestockBtn">复制清单</button>
        </div>
        <ul class="restock-list" id="restockList"></ul>
        <p class="hint-line" id="restockHint"></p>
      </section>

      <section class="panel">
        <div class="row">
          <div>
            <p class="section-label">明细核对</p>
            <div class="filters" id="filters"></div>
          </div>
          <button type="button" class="ghost" id="refreshBtn">Refresh</button>
        </div>
        <div id="tableWrap"></div>
        <p id="appErr" class="err" hidden></p>
      </section>
    </div>
  </div>

  <script>
    const CATEGORIES = ["全部", "冻干", "罐头", "汤包", "猫条", "零食", "其他"];
    const MIX_COLORS = {
      "冻干": "#0f6b5c",
      "罐头": "#9a4a1a",
      "汤包": "#3d6ea5",
      "猫条": "#6b4c9a",
      "零食": "#5a6b3a",
      "其他": "#6b645a",
    };
    const DEFAULT_THRESHOLDS = { "罐头": 6, "冻干": 3, "汤包": 2, "猫条": 2, "零食": 2, "其他": 2 };

    let state = {
      user: null,
      items: [],
      filter: "全部",
      botUsername: "",
      thresholds: { ...DEFAULT_THRESHOLDS },
      restockChecked: {},
    };

    function $(id) { return document.getElementById(id); }

    function daysUntil(bestBy) {
      if (!bestBy) return null;
      const d = new Date(String(bestBy).slice(0, 10) + "T12:00:00");
      if (Number.isNaN(d.getTime())) return null;
      const today = new Date();
      today.setHours(12, 0, 0, 0);
      return Math.round((d - today) / 86400000);
    }

    function urgencyRank(item) {
      const d = daysUntil(item.best_by);
      if (d == null) return 3;
      if (d < 0) return 0;
      if (d <= 7) return 1;
      if (d <= 15) return 2;
      return 3;
    }

    function sortByUrgency(items) {
      return [...items].sort((a, b) => {
        const ra = urgencyRank(a);
        const rb = urgencyRank(b);
        if (ra !== rb) return ra - rb;
        const da = daysUntil(a.best_by);
        const db = daysUntil(b.best_by);
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      });
    }

    function catKey(item) {
      const c = (item.category || "").trim();
      if (CATEGORIES.slice(1, -1).includes(c)) return c;
      return "其他";
    }

    function qtyOf(item) {
      const n = Number(item.quantity);
      return Number.isFinite(n) ? n : 0;
    }

    function escapeHtml(s) {
      return String(s ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
        ...opts,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
      if (!res.ok) {
        const detail = (data && (data.detail || data.message)) || res.statusText;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
      }
      return data;
    }

    async function markUsed(itemId, btn) {
      if (btn) btn.disabled = true;
      try {
        await api(`/api/me/inventory/${encodeURIComponent(itemId)}/used`, {
          method: "POST",
          body: JSON.stringify({ delta: 1 }),
        });
        await loadInventory();
      } catch (e) {
        $("appErr").hidden = false;
        $("appErr").textContent = e.message || String(e);
        if (btn) btn.disabled = false;
      }
    }

    window.onTelegramAuth = async function (user) {
      try {
        $("loginHint").hidden = true;
        const data = await api("/api/auth/telegram", {
          method: "POST",
          body: JSON.stringify(user),
        });
        state.user = data.user;
        showApp();
        await loadInventory();
      } catch (e) {
        $("loginHint").hidden = false;
        $("loginHint").textContent = e.message || String(e);
      }
    };

    function renderWidget() {
      const host = $("telegramWidget");
      host.innerHTML = "";
      if (!state.botUsername) {
        $("loginHint").hidden = false;
        $("loginHint").textContent =
          "服务器未配置 TELEGRAM_BOT_USERNAME。请在 .env 设置 bot 用户名，并在 BotFather 用 /setdomain 绑定此站点域名。";
        return;
      }
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://telegram.org/js/telegram-widget.js?22";
      s.setAttribute("data-telegram-login", state.botUsername);
      s.setAttribute("data-size", "large");
      s.setAttribute("data-radius", "10");
      s.setAttribute("data-onauth", "onTelegramAuth(user)");
      s.setAttribute("data-request-access", "write");
      host.appendChild(s);
    }

    function showApp() {
      $("loginPanel").hidden = true;
      $("appPanel").hidden = false;
      const u = state.user || {};
      const bar = $("userBar");
      bar.hidden = false;
      bar.innerHTML = `
        <div class="user">
          ${u.photo_url ? `<img src="${escapeHtml(u.photo_url)}" alt="" />` : ""}
          <div>
            <strong>${escapeHtml(u.first_name || u.username || "User")}</strong>
            <div class="muted" style="font-size:0.85rem">id ${escapeHtml(u.user_id || "")}</div>
          </div>
          <button type="button" class="ghost" id="logoutBtn">Log out</button>
        </div>`;
      $("logoutBtn").onclick = async () => {
        await api("/api/auth/logout", { method: "POST", body: "{}" });
        location.reload();
      };
      renderFilters();
    }

    function renderFilters() {
      const el = $("filters");
      el.innerHTML = CATEGORIES.map((c) =>
        `<button type="button" class="chip ${state.filter === c ? "active" : ""}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join("");
      el.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          state.filter = btn.dataset.cat;
          renderFilters();
          renderTable();
        };
      });
    }

    function filteredItems() {
      let items = state.items;
      if (state.filter === "其他") {
        items = items.filter((i) => !CATEGORIES.slice(1, -1).includes(i.category));
      } else if (state.filter !== "全部") {
        items = items.filter((i) => i.category === state.filter);
      }
      return sortByUrgency(items);
    }

    function bucketItems() {
      const overdue = [];
      const soon = [];
      const later = [];
      for (const i of state.items) {
        const d = daysUntil(i.best_by);
        if (d == null) continue;
        if (d < 0) overdue.push({ ...i, _days: d });
        else if (d <= 7) soon.push({ ...i, _days: d });
        else if (d <= 15) later.push({ ...i, _days: d });
      }
      const byDays = (a, b) => a._days - b._days;
      overdue.sort(byDays);
      soon.sort(byDays);
      later.sort(byDays);
      return { overdue, soon, later };
    }

    function renderRadarItem(i) {
      const d = i._days;
      const dayLabel = d < 0 ? `${Math.abs(d)}d overdue` : `${d}d left`;
      return `<div class="radar-item">
        <div>
          <strong>${escapeHtml(i.brand || "—")}</strong>
          <div class="muted" style="font-size:0.85rem">
            ${escapeHtml(i.category || "")}${i.flavor ? " · " + escapeHtml(i.flavor) : ""}
            · ×${escapeHtml(qtyOf(i))} · ${escapeHtml(dayLabel)}
          </div>
        </div>
        <button type="button" class="small" data-used="${escapeHtml(i.id)}">Open −1</button>
      </div>`;
    }

    function renderRadarCol(title, cls, items, emptyMsg) {
      const body = items.length
        ? items.map(renderRadarItem).join("")
        : `<div class="empty" style="padding:0.6rem 0">${escapeHtml(emptyMsg)}</div>`;
      return `<div class="radar-col ${cls}"><h3>${escapeHtml(title)} · ${items.length}</h3>${body}</div>`;
    }

    function renderRadar() {
      const { overdue, soon, later } = bucketItems();
      $("radarGrid").innerHTML =
        renderRadarCol("已过期", "overdue", overdue, "没有过期项，很好。") +
        renderRadarCol("≤7 天 · 这周先吃", "soon", soon, "一周内没有临期。") +
        renderRadarCol("8–15 天", "", later, "半个月内都很从容。");
      $("radarGrid").querySelectorAll("[data-used]").forEach((btn) => {
        btn.onclick = () => markUsed(btn.dataset.used, btn);
      });
    }

    function categoryTotals() {
      const totals = {};
      for (const key of Object.keys(state.thresholds)) totals[key] = 0;
      for (const i of state.items) {
        const k = catKey(i);
        totals[k] = (totals[k] || 0) + qtyOf(i);
      }
      return totals;
    }

    function soonQtyByCategory() {
      const soon = {};
      for (const i of state.items) {
        const d = daysUntil(i.best_by);
        if (d == null || d < 0 || d > 7) continue;
        const k = catKey(i);
        soon[k] = (soon[k] || 0) + qtyOf(i);
      }
      return soon;
    }

    function buildRestockSuggestions() {
      const totals = categoryTotals();
      const soon = soonQtyByCategory();
      const suggestions = [];
      for (const [cat, threshold] of Object.entries(state.thresholds)) {
        const have = totals[cat] || 0;
        const soonQty = soon[cat] || 0;
        const afterSoon = Math.max(0, have - soonQty);
        let reason = "";
        let suggestBuy = 0;
        if (have < threshold) {
          suggestBuy = threshold - have;
          reason = `库存 ${have}，低于建议 ${threshold}`;
        } else if (afterSoon < threshold && soonQty > 0) {
          suggestBuy = threshold - afterSoon;
          reason = `一周内将用掉/临期约 ${soonQty}，之后只剩 ${afterSoon}（建议 ≥${threshold}）`;
        }
        if (suggestBuy > 0) {
          suggestions.push({
            id: cat,
            cat,
            suggestBuy,
            reason,
            have,
            critical: afterSoon === 0 && soonQty > 0,
          });
        }
      }
      suggestions.sort((a, b) => Number(b.critical) - Number(a.critical) || b.suggestBuy - a.suggestBuy);
      return suggestions;
    }

    function renderRestock() {
      const suggestions = buildRestockSuggestions();
      const list = $("restockList");
      if (!suggestions.length) {
        list.innerHTML = `<li><label class="muted">品类库存都还够，暂时不用补货。</label></li>`;
        $("restockHint").textContent = "";
        return;
      }
      list.innerHTML = suggestions.map((s) => {
        const checked = state.restockChecked[s.id] !== false;
        const voice = `再买 ${s.suggestBuy} ${s.cat === "罐头" ? "罐湿粮/罐头" : "份" + s.cat}`;
        return `<li>
          <input type="checkbox" data-restock="${escapeHtml(s.id)}" ${checked ? "checked" : ""} />
          <label>
            <strong>${escapeHtml(s.cat)}</strong> · 建议补 ${escapeHtml(s.suggestBuy)}
            ${s.critical ? ' <span class="badge danger">即将断粮</span>' : ""}
            <div class="restock-meta">${escapeHtml(s.reason)}</div>
            <div class="restock-meta">可对 bot 说：「${escapeHtml(voice)}」</div>
          </label>
        </li>`;
      }).join("");
      list.querySelectorAll("[data-restock]").forEach((cb) => {
        cb.onchange = () => {
          state.restockChecked[cb.dataset.restock] = cb.checked;
        };
      });
      const top = suggestions[0];
      $("restockHint").textContent = top
        ? `优先：${top.cat}（建议 ${top.suggestBuy}）。阈值可之后在服务器配置。`
        : "";
    }

    function copyRestock() {
      const suggestions = buildRestockSuggestions().filter(
        (s) => state.restockChecked[s.id] !== false
      );
      if (!suggestions.length) {
        $("restockHint").textContent = "没有勾选的补货项。";
        return;
      }
      const lines = ["猫粮补货清单："].concat(
        suggestions.map((s) => `- ${s.cat} ×${s.suggestBuy}（${s.reason}）`)
      );
      const text = lines.join("\n");
      navigator.clipboard.writeText(text).then(
        () => { $("restockHint").textContent = "已复制到剪贴板。"; },
        () => { $("restockHint").textContent = text; }
      );
    }

    function renderKitchen() {
      const totals = categoryTotals();
      const totalQty = Object.values(totals).reduce((a, b) => a + b, 0);
      const { overdue, soon } = bucketItems();
      const overdueN = overdue.length;
      const soonN = soon.length;
      const lowCats = Object.entries(state.thresholds)
        .filter(([cat, th]) => (totals[cat] || 0) < th)
        .map(([cat]) => cat);

      let summary = "";
      if (totalQty === 0) {
        summary = "还没有库存。去 Telegram 发一条语音开始记。";
      } else {
        const wetOk = (totals["罐头"] || 0) >= (state.thresholds["罐头"] || 6);
        const dryLow = (totals["冻干"] || 0) < (state.thresholds["冻干"] || 3);
        const bits = [];
        bits.push(wetOk ? "湿粮还够" : "湿粮偏少");
        bits.push(dryLow ? "冻干偏少" : "冻干还行");
        if (soonN) bits.push(`${soonN} 样一周内到期`);
        if (overdueN) bits.push(`${overdueN} 样已过期`);
        summary = bits.join("；") + "。";
      }
      $("kitchenSummary").textContent = summary;
      $("kitchenKpis").innerHTML = `
        <span>总件数 <b>${totalQty}</b></span>
        <span>临期≤7d <b>${soonN}</b></span>
        <span>已过期 <b>${overdueN}</b></span>
        <span>SKU <b>${state.items.length}</b></span>
      `;

      const bar = $("mixBar");
      const legend = $("mixLegend");
      if (totalQty === 0) {
        bar.innerHTML = "";
        legend.innerHTML = "";
        return;
      }
      bar.innerHTML = Object.entries(totals)
        .filter(([, n]) => n > 0)
        .map(([cat, n]) => {
          const pct = (n / totalQty) * 100;
          const color = MIX_COLORS[cat] || MIX_COLORS["其他"];
          return `<span style="width:${pct}%;background:${color}" title="${escapeHtml(cat)} ${n}"></span>`;
        })
        .join("");
      legend.innerHTML = Object.entries(totals)
        .filter(([, n]) => n > 0)
        .map(([cat, n]) => {
          const color = MIX_COLORS[cat] || MIX_COLORS["其他"];
          const low = lowCats.includes(cat) ? " · 偏低" : "";
          return `<span><i class="dot" style="background:${color}"></i>${escapeHtml(cat)} ${n}${low}</span>`;
        })
        .join("");
    }

    function renderTable() {
      const items = filteredItems();
      if (!items.length) {
        $("tableWrap").innerHTML = `<div class="empty">暂无库存。打开 Telegram bot 发一条语音录入即可。</div>`;
        return;
      }

      const rows = items.map((i) => {
        const d = daysUntil(i.best_by);
        let rowClass = "";
        let badge = "";
        if (d != null && d < 0) {
          rowClass = "overdue";
          badge = `<span class="badge danger">${Math.abs(d)}d overdue</span>`;
        } else if (d != null && d <= 7) {
          rowClass = "soon";
          badge = `<span class="badge warn">${d}d left</span>`;
        } else if (d != null) {
          badge = `<span class="badge">${d}d</span>`;
        }
        return `<tr class="${rowClass}">
          <td><strong>${escapeHtml(i.brand || "—")}</strong><div class="muted">${escapeHtml(i.flavor || "")}</div></td>
          <td>${escapeHtml(i.category || "—")}</td>
          <td>${escapeHtml(i.best_by || "—")}<div>${badge}</div></td>
          <td>×${escapeHtml(qtyOf(i))}</td>
          <td>
            <button type="button" data-used="${escapeHtml(i.id)}">Used −1</button>
          </td>
        </tr>`;
      }).join("");

      $("tableWrap").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Brand / flavor</th>
              <th>Category</th>
              <th>Best by</th>
              <th>Qty</th>
              <th></th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>`;

      $("tableWrap").querySelectorAll("[data-used]").forEach((btn) => {
        btn.onclick = () => markUsed(btn.dataset.used, btn);
      });
    }

    function renderAll() {
      renderKitchen();
      renderRadar();
      renderRestock();
      renderTable();
    }

    async function loadInventory() {
      $("appErr").hidden = true;
      try {
        const data = await api("/api/me/inventory");
        state.items = data.items || [];
        if (!state.user) state.user = { user_id: data.user_id };
        renderAll();
      } catch (e) {
        if (String(e.message).toLowerCase().includes("not signed") || String(e.message).includes("401")) {
          $("loginPanel").hidden = false;
          $("appPanel").hidden = true;
          return;
        }
        $("appErr").hidden = false;
        $("appErr").textContent = e.message || String(e);
      }
    }

    async function boot() {
      try {
        const cfg = await api("/api/dashboard/config");
        state.botUsername = cfg.bot_username || "";
        if (cfg.restock_thresholds && typeof cfg.restock_thresholds === "object") {
          state.thresholds = { ...DEFAULT_THRESHOLDS, ...cfg.restock_thresholds };
        }
        if (cfg.login_hint) {
          $("loginHint").hidden = false;
          $("loginHint").textContent = cfg.login_hint;
        }
      } catch (e) {
        $("loginHint").hidden = false;
        $("loginHint").textContent = e.message || String(e);
      }
      renderWidget();

      try {
        const me = await api("/api/me");
        state.user = { user_id: me.user_id, first_name: "Signed in" };
        showApp();
        await loadInventory();
      } catch {
        /* stay on login */
      }

      $("refreshBtn").onclick = () => loadInventory();
      $("copyRestockBtn").onclick = () => copyRestock();
    }

    boot();
  </script>
</body>
</html>
